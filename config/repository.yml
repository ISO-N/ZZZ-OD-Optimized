repositories:
  primary: github
  primary_branch: main
  branches:
    main:
      label: 主分支
      desc: 选择后请点击同步最新代码
  options:
    github:
      label: GitHub
      url: "https://github.com/ISO-N/ZZZ-OD-Optimized.git"
      use_proxy: true
env_source:
  default: github
  options:
    github:
      label: GitHub
      value: "https://github.com/OneDragon-Anything/OneDragon-Env/releases/download"
cpython_source:
  default: github
  options:
    github:
      label: GitHub
      value: "https://github.com/astral-sh/python-build-standalone/releases/download"
pip_source:
  default: alibaba
  options:
    pypi:
      label: 官方
      value: "https://pypi.org/simple"
    tsing_hua:
      label: 清华大学
      value: "https://pypi.tuna.tsinghua.edu.cn/simple"
    alibaba:
      label: 阿里云
      value: "https://mirrors.aliyun.com/pypi/simple"
resource_download:
  sources:
    github:
      label: GitHub
      use_proxy: true
  recommend:
    zh: github
    en: github
  repos:
    main:
      github: "https://github.com/ISO-N/ZZZ-OD-Optimized/releases"
    env:
      github: "https://github.com/OneDragon-Anything/OneDragon-Env/releases"
    yolo:
      github: "https://github.com/OneDragon-Anything/OneDragon-YOLO/releases"
  models:
    flash_classifier:
      label: 闪光识别
      default: yolov8n-640-flash-20250921
      repo: yolo
      tag: zzz_model
      gpu_config: flash_classifier_gpu
      required_files:
        - model.onnx
        - labels.csv
    hollow_zero_event:
      label: 空洞格子识别
      default: yolov8s-736-hollow-zero-event-0126
      repo: yolo
      tag: zzz_model
      gpu_config: hollow_zero_event_gpu
      required_files:
        - model.onnx
        - labels.csv
    lost_void_det:
      label: 迷失之地识别
      default: yolov26n-736-lost-void-det-20260630
      repo: yolo
      tag: zzz_model
      gpu_config: lost_void_det_gpu
      required_files:
        - model.onnx
        - labels.csv
regions:
  china_ghproxy:
    label: 中国 - GitHub 代理
    repository: github
    values:
      env_source: github
      pip_source: "https://mirrors.aliyun.com/pypi/simple"
      proxy_type: "ghproxy"
      resource_source: github
  oversea:
    label: 海外
    repository: github
    values:
      env_source: github
      pip_source: "https://pypi.org/simple"
      proxy_type: "None"
      resource_source: github
